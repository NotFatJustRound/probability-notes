name: build-preview

# 五章合并预览：只在 five-chapters 分支上跑，产物提交回这个分支自己。
# 不碰 pdf-latest / v<VERSION> 那两个 release，也不挪主线 tag，
# 主线 PDF 仍然是 build-pdf.yml 在 main 上编出来的那一份。
# PDF 直接提交成仓库里的单个文件（preview/），这样不用解 zip 就能取。

on:
  push:
    branches: [five-chapters]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # continue-on-error：红了也要往下走，把日志落成文本提交回来，
      # 否则我只能看到一个打不开的 zip。
      - name: Compile with XeLaTeX
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Probability_zh.tex
          latexmk_use_xelatex: true
          extra_packages: fandol

      - name: Stage preview outputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p preview
          if [ -f Probability_zh.pdf ]; then
            cp Probability_zh.pdf preview/Probability_zh-preview.pdf
          fi
          {
            echo "commit: ${GITHUB_SHA}"
            echo "compile outcome: ${{ steps.compile.outcome }}"
            echo
            echo "---- pdf ----"
            ls -l Probability_zh.pdf 2>/dev/null || echo "(没有 PDF 产出)"
            echo
            echo "---- LaTeX 报错行 ----"
            for f in Probability_zh.log *.log; do
              [ -f "$f" ] || continue
              echo "== $f =="
              grep -n -A4 '^!' "$f" | head -150 || echo "(没匹配到以 ! 开头的报错行)"
              break
            done
          } > preview/build-report.txt
          cat preview/build-report.txt

      - name: Push preview outputs back to branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview
          if git diff --cached --quiet; then
            echo "产物没变化，不提交"
          else
            git commit -m "Update five-chapter preview build [skip ci]"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Fail job when no PDF was produced
        if: always()
        run: |
          if [ -f preview/Probability_zh-preview.pdf ]; then
            echo "PDF 已产出"
          else
            echo "编译没出 PDF，看 preview/build-report.txt"
            exit 1
          fi

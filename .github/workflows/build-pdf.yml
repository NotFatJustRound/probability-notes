name: build-pdf

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Probability_zh.tex
          latexmk_use_xelatex: true
          extra_packages: fandol

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: probability-notes-pdf
          path: Probability_zh.pdf

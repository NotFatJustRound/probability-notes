name: build-pdf

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Probability_zh.tex
          latexmk_use_xelatex: true
          extra_packages: fandol

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: probability-notes-pdf
          path: Probability_zh.pdf

      # 两个 release：
      #   1. v<VERSION>  —— 带版本号的正式版，版本号一改就新开一个页面，方便回头找旧版
      #   2. pdf-latest  —— 滚动更新的固定链接，永远是最新编译结果
      # 两者都覆盖同名附件，下载链接不变，打开直接下 PDF，不用解 zip。
      - name: Publish PDF to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(tr -d ' \r\n' < VERSION)"
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          SHORT="${GITHUB_SHA:0:7}"
          BODY="由 build-pdf.yml 自动编译（xelatex + fandol）。
          版本 v${VER} · commit ${SHORT} · ${STAMP}"

          # 版本化 release
          if gh release view "v${VER}" > /dev/null 2>&1; then
            gh release upload "v${VER}" Probability_zh.pdf --clobber
            gh release edit "v${VER}" --notes "$BODY" --latest
          else
            gh release create "v${VER}" Probability_zh.pdf \
              --title "概率论与数理统计笔记 v${VER}" \
              --notes "$BODY" \
              --target "$GITHUB_SHA" \
              --latest
          fi

          # 滚动 latest 链接
          if gh release view pdf-latest > /dev/null 2>&1; then
            gh release upload pdf-latest Probability_zh.pdf --clobber
          else
            gh release create pdf-latest Probability_zh.pdf \
              --title "最新编译版 PDF" \
              --notes "滚动更新，永远指向最新一次编译。" \
              --target "$GITHUB_SHA"
          fi
          gh release edit pdf-latest --notes "滚动更新，永远指向最新一次编译。
          当前 v${VER} · commit ${SHORT} · ${STAMP}"

          # 两个 tag 都跟到最新提交，release 页显示的就是对应源码
          git tag -f "v${VER}" "$GITHUB_SHA"
          git tag -f pdf-latest "$GITHUB_SHA"
          git push -f origin "refs/tags/v${VER}" "refs/tags/pdf-latest"

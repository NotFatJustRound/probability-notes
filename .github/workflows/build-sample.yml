name: build-sample

# 样章专用：只在 chap05-sample 分支上跑，验证 chap_05.tex 真能编出来。
# 不动主线 build-pdf.yml；PDF 挂到一个预发布 release 上滚动覆盖，
# 因为 artifact 只能整包 zip 下载，而 release 附件点开就是 PDF。

on:
  push:
    branches: [chap05-sample]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile sample with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: chap_05_sample.tex
          latexmk_use_xelatex: true
          extra_packages: fandol

      - name: Upload sample PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chap05-sample-pdf
          path: chap_05_sample.pdf

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chap05-compile-log
          path: |
            chap_05_sample.log
            chap_05_sample.blg
          if-no-files-found: warn

      - name: Publish sample PDF to rolling pre-release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NOTES="chap05-sample 分支样章的编译结果，滚动覆盖，未并入主线。
          commit ${GITHUB_SHA:0:7} · ${STAMP}"
          if gh release view chap05-sample > /dev/null 2>&1; then
            gh release upload chap05-sample chap_05_sample.pdf --clobber
            gh release edit chap05-sample --notes "$NOTES"
          else
            gh release create chap05-sample chap_05_sample.pdf \
              --title '样章 chap_05（分支构建，未并入主线）' \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

      # 纯粹是给我取 xelatex 错误行用的脚手架：log 在 artifact 的 zip 里我读不到，
      # 就把摘录提交回分支当文本文件读。编译绿了以后这一步没什么用，
      # 所以它失败不该把整个构建染红（两次假红都撞在这里：并发 push 被拒）。
      - name: Publish error extract
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          SKIP='[skip'" ci']"
          git config user.name "build-sample"
          git config user.email "build-sample@users.noreply.github.com"
          {
            echo '# chap_05 编译摘录'
            echo
            echo 'commit '"${GITHUB_SHA:0:7}"
            echo
            echo '```'
            if [ -f chap_05_sample.log ]; then
              { grep -n -E '^(l\.[0-9]+ |! |LaTeX Error|Package .* Error|Fatal |! Undefined|! Missing)' chap_05_sample.log || echo '（没有匹配到错误行）'; } | head -n 150
              echo '--- tail ---'
              tail -n 12 chap_05_sample.log
            else
              echo '没有 chap_05_sample.log（编译步没跑起来？）'
            fi
            echo '```'
          } > chap05-build-report.md
          git add chap05-build-report.md
          git commit -m "chap_05: 更新编译错误摘录 $SKIP" || echo "无改动，跳过提交"
          git push origin HEAD:chap05-sample || echo "push 被拒：多半是同一分支上另一个 run 先推了，不影响构建结论"
